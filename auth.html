<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09030a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="./favicon-32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Novera Couple — Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-screen">
  <div class="bg-grid"></div><div class="orb orb-a"></div><div class="orb orb-b"></div>
  <main class="auth-wrap">
    <section class="glass auth-card">
      <a class="brand auth-brand" href="./index.html" aria-label="Novera Couple">
        <img src="./nexora-icon.svg" alt="Novera">
        <div><b>NOVERA</b><span>COUPLE</span></div>
      </a>
      <div class="auth-heading">
        <span class="label">PRIVATE ACCOUNT</span>
        <h1>Stay connected.<br><em>Stay yours.</em></h1>
        <p>Login untuk menyimpan profil dan mengakses akunmu kembali dari perangkat lain.</p>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="showLogin" type="button">Login</button>
        <button class="auth-tab" id="showRegister" type="button">Buat akun</button>
      </div>
      <form id="loginForm" class="auth-form">
        <label>Email<input id="loginEmail" type="email" autocomplete="email" required placeholder="nama@email.com"></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
        <button class="btn primary auth-submit" type="submit">Login</button>
      </form>
      <form id="registerForm" class="auth-form hidden">
        <label>Nama<input id="registerName" type="text" maxlength="40" autocomplete="name" required placeholder="Nama kamu"></label>
        <label>Email<input id="registerEmail" type="email" autocomplete="email" required placeholder="nama@email.com"></label>
        <label>Password<input id="registerPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="Minimal 6 karakter"></label>
        <button class="btn primary auth-submit" type="submit">Buat akun</button>
      </form>
      <p class="auth-message" id="authMessage" aria-live="polite"></p>
      <a class="auth-back" href="./index.html">Lanjut sebagai akun tamu</a>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
